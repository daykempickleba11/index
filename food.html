<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ăn gì nè? 🍽️</title>
  <link rel="stylesheet" href="css/theme.css" />
  <script src="config.js"></script>
  <script src="effects.js"></script>
</head>
<body>
  <main class="wrap">
    <section class="card" style="padding:22px 18px;">
      <div class="title">Tối đó mình ăn gì nè? 🍽️</div>
      <p class="subtitle">Em chọn món em thích, anh chọn ngồi đối diện em 😌</p>
      <div class="grid" id="grid"></div>
      <div style="margin-top:14px"><span class="pill" id="picked">Đã chọn: chạm một lựa chọn ✨</span></div>
      <button class="btn btnPrimary btnFull" id="next" disabled style="margin-top:16px">Chọn món ngọt tiếp 🍰</button>
      <div class="secretNote">Món chính chỉ là phụ thôi. Nhân vật chính đang đọc dòng này đó 😌</div>
    </section>
  </main>
<script>
  LoveFX.progress(60,'Chọn món ăn');
  const cfg=window.VALENTINE_CONFIG||{},grid=document.getElementById('grid'),opts=cfg.foodOptions||[];
  grid.innerHTML=opts.map(o=>`<div class="option" data-value="${o.title} ${o.emoji}"><div class="optionTitle">${o.title} ${o.emoji}</div><p class="optionText">${o.subtitle||''}</p></div>`).join('');
  const items=[...document.querySelectorAll('.option')],picked=document.getElementById('picked'),next=document.getElementById('next');let choice='';
  items.forEach(i=>i.onclick=()=>{items.forEach(x=>x.classList.remove('active'));i.classList.add('active');choice=i.dataset.value;picked.textContent='Đã chọn: '+choice;next.disabled=false;LoveFX.selectionFX(i,'Món này được đó 😋')});
  next.onclick=()=>{localStorage.setItem('food_choice',choice);LoveFX.chime();setTimeout(()=>location.href='dessert.html',250)};
</script>
</body>
</html>
