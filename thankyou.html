<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Em giữ lời đó nha 💖</title>
  <link rel="stylesheet" href="css/theme.css" />
  <script src="config.js"></script><script src="effects.js"></script>
</head>
<body>
<div class="lantern left">🏮</div><div class="lantern right">🏮</div>
<main class="wrap">
  <section class="card">
    <div class="heartSeal">♥</div>
    <div class="eyebrow">đã ghi nhận câu trả lời</div>
    <h1 class="title">Vậy là <span class="hot">anh đồng ý</span> rồi nha 💖</h1>
    <p class="subtitle">Em sẽ giả vờ bình tĩnh, mặc dù trong đầu đang bắn pháo hoa hơi nhiều.</p>
    <div class="fullLetter">
      Em không cần một buổi tối thật sang. Em chỉ muốn có một buổi tối mà <strong>anh không vội, em không bận</strong>, rồi hai đứa cứ đi đâu đó, ăn gì đó, nói chuyện thật lâu.
    </div>
    <button class="btn btnPrimary btnFull btnGlow" id="next" style="margin-top:18px">Anh chọn kèo với em nha 🏮</button>
  </section>
</main>
<script>
LoveFX.progress(20,'Anh đã đồng ý');
LoveFX.chime('big'); LoveFX.burst(34,['💖','✨','🌕']);
document.getElementById('next').onclick=()=>LoveFX.go('date.html');
</script>
</body>
</html>
