<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Món ngọt 🍰</title>
    <link rel="stylesheet" href="css/theme.css" />
    <script src="config.js"></script>
    <style>
      .requiredOption{
        grid-column: 1 / -1;
        position: relative;
        overflow: hidden;
        border-color: rgba(231,111,81,.42);
        background: linear-gradient(135deg, rgba(255,255,255,.94), rgba(255,236,225,.96));
      }
      .requiredOption::after{
        content: "PHẢI CHỌN 😏";
        position: absolute;
        top: 9px;
        right: 11px;
        font-size: 10px;
        font-weight: 1000;
        letter-spacing: .5px;
        color: #e76f51;
        background: rgba(255,255,255,.86);
        border: 1px solid rgba(231,111,81,.22);
        border-radius: 999px;
        padding: 5px 8px;
      }
      .requiredOption.active{
        box-shadow: 0 10px 28px rgba(231,111,81,.20);
      }
      .tease{
        min-height: 22px;
        margin-top: 10px;
        font-size: 13px;
        font-weight: 800;
        color: #d85f43;
        text-align: center;
      }
      .nudge{
        animation: nudge .38s ease-in-out;
      }
      @keyframes nudge{
        0%,100%{ transform: translateX(0); }
        25%{ transform: translateX(-7px); }
        50%{ transform: translateX(7px); }
        75%{ transform: translateX(-4px); }
      }
    </style>
  </head>

  <body>
    <main class="wrap">
      <section class="card" style="padding:18px 16px 18px;">
        <div class="title">Thêm chút ngọt ngào nha 🍰</div>
        <p class="subtitle">Chọn món kết thúc cho buổi đi chơi Trung Thu.</p>

        <div class="grid" id="grid"></div>
        <div class="tease" id="tease"></div>

        <div style="margin-top:8px;"><span class="pill" id="picked">Đã chọn: chạm một lựa chọn ✨</span></div>

        <div style="margin-top:14px;">
          <button class="btn btnPrimary btnFull" id="next" disabled>Xem kèo của tụi mình 💖</button>
        </div>
      </section>
    </main>

    <script>
      const cfg = window.VALENTINE_CONFIG || {};
      const grid = document.getElementById('grid');
      const options = Array.isArray(cfg.dessertOptions) && cfg.dessertOptions.length ? cfg.dessertOptions : [];

      grid.innerHTML = options.map((o, idx) => `
        <div class="option ${o.required ? 'requiredOption' : ''}" data-index="${idx}" data-value="${o.title} ${o.emoji}" data-required="${o.required ? '1' : '0'}">
          <div class="optionTitle">${o.title} ${o.emoji}</div>
          <p class="optionText">${o.subtitle || ''}</p>
        </div>
      `).join('');

      const items = document.querySelectorAll('.option');
      const requiredItem = document.querySelector('.requiredOption');
      const picked = document.getElementById('picked');
      const tease = document.getElementById('tease');
      const next = document.getElementById('next');
      let choice = '';

      function nudgeRequired(){
        if (!requiredItem) return;
        requiredItem.classList.remove('nudge');
        void requiredItem.offsetWidth;
        requiredItem.classList.add('nudge');
      }

      items.forEach(i => {
        i.addEventListener('click', () => {
          const isRequired = i.dataset.required === '1';

          if (!isRequired) {
            items.forEach(x => x.classList.remove('active'));
            choice = '';
            next.disabled = true;
            picked.textContent = 'Chưa được tính đâu nha 😏';
            tease.textContent = 'Không được chọn đường khác đâu 😌 Phải bấm “Vị ngọt trên đôi môi anh” mới đi tiếp 💋';
            nudgeRequired();
            if (requiredItem) requiredItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            return;
          }

          items.forEach(x => x.classList.remove('active'));
          i.classList.add('active');
          choice = i.dataset.value;
          picked.textContent = 'Đã chọn: ' + choice;
          tease.textContent = 'Ngoan 😏 Chốt món ngọt này nha 💖';
          next.disabled = false;
        });
      });

      next.addEventListener('click', () => {
        if (!choice || !requiredItem || !requiredItem.classList.contains('active')) {
          tease.textContent = 'Muốn qua bước tiếp theo thì biết phải bấm gì rồi đó 😏💋';
          nudgeRequired();
          return;
        }
        localStorage.setItem('dessert_choice', choice);
        location.href = 'lastpage.html';
      });
    </script>
  </body>
</html>
