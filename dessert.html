<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Món ngọt 🍰</title>
  <link rel="stylesheet" href="css/theme.css" />
  <script src="config.js"></script>
  <script src="effects.js"></script>
  <style>
    .requiredOption{grid-column:1/-1;position:relative;overflow:hidden;border-color:rgba(255,79,123,.48);background:linear-gradient(135deg,#fff,#fff0f5);animation:softPulse 1.8s ease-in-out infinite}
    .requiredOption::after{content:"OPTION ĐÚNG 💋";position:absolute;top:9px;right:11px;font-size:10px;font-weight:1000;letter-spacing:.5px;color:#ff4f7b;background:rgba(255,255,255,.9);border:1px solid rgba(255,79,123,.24);border-radius:999px;padding:5px 8px}
    @keyframes softPulse{50%{box-shadow:0 0 0 8px rgba(255,79,123,.06),0 18px 34px rgba(255,79,123,.12)}}
    .tease{min-height:24px;margin-top:10px;font-size:13px;font-weight:900;color:#d85f62;text-align:center}
    .nudge{animation:nudge .38s ease-in-out!important}@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" style="padding:22px 18px;">
      <div class="title">Rồi tới phần quan trọng nhất… món ngọt 🍰</div>
      <p class="subtitle">Câu này có đáp án đúng nha. Chọn cẩn thận 😌</p>
      <div class="grid" id="grid"></div>
      <div class="tease" id="tease"></div>
      <div style="margin-top:8px"><span class="pill" id="picked">Đã chọn: chạm một lựa chọn ✨</span></div>
      <button class="btn btnPrimary btnFull" id="next" disabled style="margin-top:16px">Xem kèo của tụi mình 💖</button>
    </section>
  </main>

  <div class="climax" id="kissClimax">
    <div class="climaxCard">
      <div style="font-size:58px">💋💖✨</div>
      <div class="climaxTitle">Biết ngay em sẽ chọn cái này 😌</div>
      <div class="climaxSub">Món ngọt đã chốt: <b>“Vị ngọt trên đôi môi anh”</b><br>Hệ thống xác nhận gu của em rất có tương lai 😭💘</div>
      <button class="btn btnPrimary glow" id="closeClimax" style="margin-top:24px;background:linear-gradient(135deg,#fff,#ffd7e1);color:#b92e58">Rồi rồi, xem kèo tiếp 😳</button>
    </div>
  </div>
<script>
  LoveFX.progress(80,'Chọn món ngọt');
  const cfg=window.VALENTINE_CONFIG||{},grid=document.getElementById('grid'),opts=cfg.dessertOptions||[];
  grid.innerHTML=opts.map((o,idx)=>`<div class="option ${o.required?'requiredOption':''}" data-index="${idx}" data-value="${o.title} ${o.emoji}" data-required="${o.required?'1':'0'}"><div class="optionTitle">${o.title} ${o.emoji}</div><p class="optionText">${o.subtitle||''}</p></div>`).join('');
  const items=[...document.querySelectorAll('.option')],required=document.querySelector('.requiredOption'),picked=document.getElementById('picked'),tease=document.getElementById('tease'),next=document.getElementById('next'),climax=document.getElementById('kissClimax');let choice='';
  function nudge(){if(!required)return;required.classList.remove('nudge');void required.offsetWidth;required.classList.add('nudge')}
  const wrong=['Sai rồi nha 😌 Đáp án ở dưới kìa 💋','Ủa em tính né câu này hả 😭','Không được chọn đường an toàn đâu 😏','Anh làm web tới đây rồi mà em còn chọn chè hả 😂'];let wrongCount=0;
  items.forEach(i=>i.onclick=()=>{
    const ok=i.dataset.required==='1';
    if(!ok){items.forEach(x=>x.classList.remove('active'));choice='';next.disabled=true;picked.textContent='Chưa được tính đâu nha 😏';tease.textContent=wrong[Math.min(wrongCount++,wrong.length-1)];nudge();LoveFX.selectionFX(i,'Đáp án này bị hệ thống từ chối 😂');if(required)required.scrollIntoView({behavior:'smooth',block:'nearest'});return}
    items.forEach(x=>x.classList.remove('active'));i.classList.add('active');choice=i.dataset.value;picked.textContent='Đã chọn: '+choice;tease.textContent='Ngoan 😌 Đúng đáp án rồi đó 💖';next.disabled=false;LoveFX.chime('big');LoveFX.burst(46,['💋','💖','✨','🌕']);LoveFX.fireworks(2600);setTimeout(()=>climax.classList.add('show'),280)
  });
  document.getElementById('closeClimax').onclick=()=>climax.classList.remove('show');
  next.onclick=()=>{if(!choice){nudge();return}localStorage.setItem('dessert_choice',choice);LoveFX.chime('big');setTimeout(()=>location.href='lastpage.html',350)};
</script>
</body>
</html>
