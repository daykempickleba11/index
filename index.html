<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Đi chơi Trung Thu với mình nha 🏮</title>
    <link rel="stylesheet" href="css/theme.css" />
    <script src="config.js"></script>
  </head>

  <body>
    <main class="wrap">
      <section class="card" style="padding:18px 16px 22px;">
        <div class="title">
          <span class="pink" id="partnerName">Cậu</span>, Trung Thu này đi chơi với mình nha? 🌕🏮
        </div>
        <p class="subtitle">Mình có một kế hoạch nhỏ xíu, nhưng sẽ vui hơn nhiều nếu có cậu 🤍</p>

        <div class="row">
          <button class="btn btnPrimary" id="yesBtn" onclick="location.href='thankyou.html'">Đi chứ 💖</button>
          <button class="btn btnGhost" id="noButton">Hông 🙈</button>
        </div>

        <img src="cat.gif" alt="mèo dễ thương" class="imgHero" />
        <div class="tip">Thử bấm “Hông” xem 😆</div>
      </section>
    </main>

    <script>
      let lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        function (event) {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) event.preventDefault();
          lastTouchEnd = now;
        },
        { passive: false }
      );

      const cfg = window.VALENTINE_CONFIG || {};
      const partner = cfg.partnerName || "Cậu";
      document.getElementById("partnerName").textContent = partner;

      const noButton = document.getElementById("noButton");
      const yesBtn = document.getElementById("yesBtn");

      const noTexts = ["Hông 🙈", "Ê khoan 😳", "Bắt được tui đi 😝", "Hông nhaaa 🏃‍♀️", "Thôi bấm Đi chứ đi 🥹", "Hehe không cho bấm 😆"];
      let dodgeCount = 0;

      function burstIcons() {
        const icons = ["🏮", "🌕", "✨", "💖", "🥮"];
        for (let i = 0; i < 5; i++) {
          const h = document.createElement("div");
          h.className = "floatHeart";
          h.textContent = icons[Math.floor(Math.random() * icons.length)];
          h.style.left = Math.random() * 100 + "vw";
          h.style.fontSize = 14 + Math.random() * 18 + "px";
          h.style.animationDelay = Math.random() * 0.25 + "s";
          document.body.appendChild(h);
          setTimeout(() => h.remove(), 3500);
        }
      }

      function moveNoButton() {
        const rect = noButton.getBoundingClientRect();
        const pad = 16;
        const maxX = Math.max(pad, window.innerWidth - rect.width - pad);
        const maxY = Math.max(pad, window.innerHeight - rect.height - pad);

        let x = pad + Math.random() * Math.max(1, maxX - pad);
        let y = pad + Math.random() * Math.max(1, maxY - pad);

        // Tránh nhảy đè trực tiếp lên nút Đồng ý
        const yesRect = yesBtn.getBoundingClientRect();
        let tries = 0;
        while (tries < 12 && x < yesRect.right + 28 && x + rect.width > yesRect.left - 28 && y < yesRect.bottom + 28 && y + rect.height > yesRect.top - 28) {
          x = pad + Math.random() * Math.max(1, maxX - pad);
          y = pad + Math.random() * Math.max(1, maxY - pad);
          tries++;
        }

        noButton.classList.add("runaway");
        noButton.style.left = x + "px";
        noButton.style.top = y + "px";
        noButton.textContent = noTexts[Math.min(++dodgeCount, noTexts.length - 1)];

        if (dodgeCount % 2 === 0) burstIcons();
      }

      // Máy tính: vừa dí chuột tới là chạy
      noButton.addEventListener("pointerenter", moveNoButton);
      noButton.addEventListener("mouseenter", moveNoButton);

      // Điện thoại: vừa chạm là chạy, không kịp bấm
      noButton.addEventListener("touchstart", (e) => {
        e.preventDefault();
        moveNoButton();
      }, { passive: false });

      // Nếu click lọt được thì vẫn né tiếp
      noButton.addEventListener("click", (e) => {
        e.preventDefault();
        moveNoButton();
      });

      // Khi resize/xoay màn hình, đưa nút về vùng nhìn thấy
      window.addEventListener("resize", () => {
        if (noButton.classList.contains("runaway")) moveNoButton();
      });
    </script>
  </body>
</html>
